name: Assignment 13 Quality Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: 'true'
      HUSKY: '0'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run formatting, lint, TypeScript, and tests
        run: npm run check

      - name: Build production React application
        run: npm run build
